name: Build macOS (Apple Silicon)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：上传到指定 Release 标签（如 v1.0.0）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Generate macOS .icns icon
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo.png --out build/icon.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/logo.png --out build/icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/OrangeBiliRequest.icns

      - name: Build .app with PyInstaller (arm64)
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name OrangeBiliRequest \
            --target-arch arm64 \
            --icon build/OrangeBiliRequest.icns \
            --add-data "assets:assets" \
            main.py

      - name: Package .app as .dmg
        run: |
          rm -rf build/dmg
          mkdir -p build/dmg
          cp -R dist/OrangeBiliRequest.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Orange BiliRequest" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            OrangeBiliRequest-macOS-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeBiliRequest-macOS-arm64
          path: OrangeBiliRequest-macOS-arm64.dmg
          retention-days: 30

      - name: Attach to GitHub Release (on tag or input)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" OrangeBiliRequest-macOS-arm64.dmg --clobber
            gh release delete-asset "$TAG" OrangeBiliRequest-macOS-arm64.zip -y || true
          else
            gh release create "$TAG" OrangeBiliRequest-macOS-arm64.dmg --title "$TAG" --generate-notes
          fi
